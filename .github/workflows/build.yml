name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Install Web dependencies
        working-directory: src/web
        run: npm ci

      - name: Lint Web
        working-directory: src/web
        run: npm run lint

      - name: Build Web
        working-directory: src/web
        run: npm run build
